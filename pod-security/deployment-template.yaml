apiVersion: apps/v1
kind: Deployment
metadata:
  name: secure-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: secure-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: secure-service
    spec:
      serviceAccountName: workload
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: ghcr.io/example/service@sha256:replace-with-digest
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
