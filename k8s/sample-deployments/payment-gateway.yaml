apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-gateway
  namespace: payments-prod
  labels:
    app.kubernetes.io/name: payment-gateway
    finserv.digital/domain: payments
    finserv.digital/environment: prod
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: payment-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: payment-gateway
        finserv.digital/domain: payments
        finserv.digital/environment: prod
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: payment-gateway
          image: registry.finserv.example/payment-gateway@sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
