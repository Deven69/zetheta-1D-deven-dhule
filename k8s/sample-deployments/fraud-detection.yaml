apiVersion: apps/v1
kind: Deployment
metadata:
  name: fraud-detection
  namespace: risk-prod
  labels:
    app.kubernetes.io/name: fraud-detection
    finserv.digital/domain: risk
    finserv.digital/environment: prod
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: fraud-detection
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fraud-detection
        finserv.digital/domain: risk
        finserv.digital/environment: prod
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: fraud-detection
          image: registry.finserv.example/fraud-detection@sha256:abcdef0123456789abcdef0123456789abcdef0123456789abcdef0123456789
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: 2000m
              memory: 2Gi
