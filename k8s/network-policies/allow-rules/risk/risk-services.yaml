apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-fraud-detection
  namespace: risk-prod
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: fraud-detection
  policyTypes: [Ingress, Egress]
  ingress: []
  egress: []
