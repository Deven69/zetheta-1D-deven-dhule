apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-gateway
  namespace: platform-prod
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: ingress-gateway
  policyTypes: [Ingress, Egress]
  ingress: []
  egress: []
