apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-payment-gateway
  namespace: payments-prod
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: payment-gateway
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              domain: platform
          podSelector:
            matchLabels:
              app.kubernetes.io/name: ingress-gateway
      ports:
        - protocol: TCP
          port: 8443
  egress: []
---
