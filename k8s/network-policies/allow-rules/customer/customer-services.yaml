apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-customer-api
  namespace: customer-prod
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: customer-api
  policyTypes: [Ingress, Egress]
  ingress: []
  egress: []
