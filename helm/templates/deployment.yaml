apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "finserv-service.fullname" . }}
  namespace: {{ .Values.namespace }}
  labels:
    finserv.digital/environment: {{ .Values.environment }}
    finserv.digital/domain: payments
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "finserv-service.name" . }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "finserv-service.name" . }}
        finserv.digital/environment: {{ .Values.environment }}
        finserv.digital/domain: payments
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: "{{ .Values.image.repository }}@{{ .Values.image.digest }}"
          securityContext:
{{ toYaml .Values.securityContext | indent 12 }}
          ports:
            - name: https
              containerPort: {{ .Values.service.port }}
          resources:
{{ toYaml .Values.resources | indent 12 }}
